<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1193" width="1040" height="1193" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
