<text x="62" y="571.0" class="it-hl"><tspan class="n">Cost Tracking &amp; Allocation</tspan> (Token consumption logs per team)</text>
<circle cx="50" cy="586.0" r="2.5" fill="#e8622c"/>
<text x="62" y="590.0" class="it-hl"><tspan class="n">Centralized Guardrails &amp; Safety Filters</tspan></text>
<circle cx="50" cy="605.0" r="2.5" fill="#e8622c"/>
<text x="62" y="609.0" class="it-hl"><tspan class="n">Model Routing &amp; Fallback Logic</tspan> (Switching models without code changes)</text>
